<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Tasks</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>My Daily Tasks</h1>
    <p>A small project powered by a Jenkins pipeline.</p>

    <form id="task-form">
      <label for="task-input">New task</label>
      <div class="input-row">
        <input
          id="task-input"
          type="text"
          placeholder="Example: Practise Jenkins"
          maxlength="150"
          required
        >
        <button type="submit">Add</button>
      </div>
    </form>

    <ul id="task-list"></ul>
    <p id="task-count" aria-live="polite">0 tasks remaining</p>
  </main>
</body>
</html>
